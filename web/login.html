<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LLife</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{document.documentElement.dataset.th=localStorage.th||"auto"}catch(e){}</script>
</head>
<body class="lg">
<form method="post" action="/login">
  <h1>L<em>Life</em></h1>
  <input name="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Passcode" autofocus required>
  <input name="next" type="hidden">
  <p id="e" hidden>Wrong passcode</p>
</form>
<script>
const q=new URLSearchParams(location.search),f=document.forms[0];
f.next.value=q.get('next')||'';e.hidden=!q.get('e');
f.code.oninput=()=>f.code.value.length==6&&f.submit();
</script>
</body>
</html>
